name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Python 3.11)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      # CadQuery's OpenCascade/VTK bindings need these shared libraries at
      # import time — the same set installed in backend/Dockerfile.
      - name: Install OpenCascade/VTK runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libglu1-mesa libxrender1 libxext6 libsm6 libgomp1

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Ruff
        run: ruff check .

      - name: Pytest (all tests)
        run: python -m pytest -q

  frontend:
    name: Frontend (Node 24)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: TypeScript build (strict type-check)
        run: npx tsc -b

      - name: Production build (Vite)
        run: npx vite build

  docker-smoke-test:
    name: Docker smoke test
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and start containers
        run: docker compose up -d --build

      - name: Wait for backend health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/api/health; then
              echo ""
              echo "Backend is healthy."
              exit 0
            fi
            echo "Waiting for backend health ($i/30)..."
            sleep 5
          done
          echo "Backend did not become healthy in time."
          exit 1

      - name: Verify backend health endpoint
        run: curl -fsS http://localhost:8000/api/health

      - name: Verify API documentation is served
        run: curl -fsS http://localhost:8000/docs > /dev/null

      - name: Verify frontend is served
        run: curl -fsS http://localhost:3000 > /dev/null

      - name: Print container logs on failure
        if: failure()
        run: docker compose logs

      - name: Shut down containers
        if: always()
        run: docker compose down -v
