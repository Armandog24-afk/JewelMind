[project]
name = "jewelmind-backend"
version = "0.1.0"
description = "JewelMind parametric jewelry CAD backend"
authors = [{ name = "Armando Gervasi", email = "armandogervasi91@gmail.com" }]
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
