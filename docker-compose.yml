# Reads a .env file in this directory automatically (standard Docker
# Compose behavior) — copy .env.example to .env to override any of the
# ${VAR:-default} values below without editing this file. No .env is
# required: every variable has a working default.
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      JEWELMIND_CORS_ORIGINS: "${JEWELMIND_CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "3000:3000"
    environment:
      VITE_API_BASE_URL: "${VITE_API_BASE_URL:-http://localhost:8000}"
    depends_on:
      backend:
        condition: service_healthy
